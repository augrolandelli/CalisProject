# SQL Server para desarrollo local de CalisApi.
# Uso: docker compose up -d
# La cadena de conexion ya esta en backend/CalisApi/appsettings.Development.json
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: calisapp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Password123!" # solo dev local, nunca reutilizar en prod
    ports:
      - "1433:1433"
    volumes:
      - calisapp-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  calisapp-sqlserver-data:

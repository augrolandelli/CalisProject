# Docker Compose de producción para Easy Panel / VPS.
# Uso local (con variables en .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# En Easy Panel podés subir este archivo y dejar que el panel levante ambos servicios.
# Nota: Easy Panel gestiona sus propias redes y nombres de contenedor, por eso no se
# definen explícitamente aquí.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CalisAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: CalisApi
      Jwt__Audience: CalisApp
      Jwt__AccessTokenMinutes: 30
      Jwt__RefreshTokenDays: 14
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
      Storage__Provider: Local
      Storage__LocalPath: /app/storage
      Push__VapidPublicKey: ${VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${VAPID_PRIVATE_KEY:-}
      Push__Subject: ${VAPID_SUBJECT:-mailto:admin@calisapp.com}
      # Seeding opcional de un usuario admin en producción si aún no existe ninguno.
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-admin@calisapp.com}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-Admin123!}
      AdminSeed__FullName: ${ADMIN_SEED_FULL_NAME:-Admin CalisApp}
      AdminSeed__Phone: ${ADMIN_SEED_PHONE:-0000000000}
    volumes:
      - storage-data:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  storage-data:
  sqlserver-data:
